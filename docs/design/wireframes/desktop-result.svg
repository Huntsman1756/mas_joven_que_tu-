<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"
     aria-label="Wireframe desktop del resultado de Tu Bizkaia">
  <title>Wireframe · Desktop 1440×900 · Resultado (RESULT, celdas)</title>
  <style>
    .bg{fill:#f6f7f9}.card{fill:#ffffff;stroke:#d4d4d8;stroke-width:1}
    .band{fill:#ffffff;stroke:#e4e4e7;stroke-width:1}
    .h1{font:700 38px/1.15 Georgia,serif;fill:#18181b}
    .lead{font:20px/1.45 system-ui,sans-serif;fill:#27272a}
    .meta{font:15px/1.4 system-ui,sans-serif;fill:#52525b}
    .lbl{font:600 12px/1.2 system-ui,sans-serif;fill:#52525b;letter-spacing:.04em;text-transform:uppercase}
    .t{font:14px/1.3 system-ui,sans-serif;fill:#18181b}
    .ax{font:11px/1.2 system-ui,sans-serif;fill:#71717a}
    .ann{font:13px/1.3 system-ui,sans-serif;fill:#1d4ed8}
    .anl{stroke:#1d4ed8;stroke-width:1}
    .foot{font:12px/1.4 system-ui,sans-serif;fill:#52525b}
    .chip{font:14px/1 system-ui,sans-serif;fill:#18181b}
    .btn2{fill:#fff;stroke:#a1a1aa;stroke-width:1.2}
    .btn2t{font:600 15px/1 system-ui,sans-serif;fill:#18181b}
    .bar-old{fill:#9fb3d1}.bar-before{fill:#7f97bf}.bar-after{fill:#d1495b}.bar-none{fill:#d4d4d8}
  </style>

  <rect class="bg" width="1440" height="900"/>

  <!-- header sticky -->
  <rect class="card" x="0" y="0" width="1440" height="64"/>
  <text class="t" x="48" y="39" font-weight="700" letter-spacing="0.06em">MÁS JOVEN QUE TÚ</text>
  <rect class="btn2" x="560" y="16" width="220" height="32" rx="16"/>
  <text class="chip" x="576" y="37">1987 · Leioa</text>
  <text class="chip" x="792" y="37" fill="#52525b">▾</text>
  <rect class="btn2" x="1290" y="16" width="110" height="32" rx="6"/>
  <text class="btn2t" x="1312" y="37">Compartir</text>

  <!-- banda editorial -->
  <rect class="band" x="0" y="64" width="1440" height="292"/>
  <text class="h1" x="120" y="140">Eres mayor que una parte de los edificios</text>
  <text class="h1" x="120" y="184">que hoy forman Leioa.</text>

  <text class="lead" x="120" y="234">Entre los edificios actuales cuyo año de construcción consta en Catastro,</text>
  <text class="lead" x="120" y="260"><tspan font-weight="700">47,6 de cada 100</tspan> se terminó después de 1987.</text>

  <text class="meta" x="120" y="298">Cobertura del dato: 2.385 de 2.390 edificios (99,8 %). La cifra se calcula solo sobre esos 2.385.</text>
  <text class="meta" x="120" y="320">· 0 sin año · 5 con año anómalo. El Catastro describe los edificios que existen hoy.</text>
  <text class="meta" x="120" y="344" fill="#1d4ed8" text-decoration="underline">¿Cómo se calcula?</text>

  <!-- banda de mapa -->
  <rect x="0" y="356" width="1440" height="300" fill="#eef1f5"/>
  <g stroke="#ffffff" stroke-width="1">
    <rect x="152" y="392" width="52" height="52" fill="#e8eaf0"/>
    <rect x="204" y="392" width="52" height="52" fill="#c7d2e5"/>
    <rect x="256" y="392" width="52" height="52" fill="#9fb3d1"/>
    <rect x="152" y="444" width="52" height="52" fill="#7f97bf"/>
    <rect x="204" y="444" width="52" height="52" fill="#a56b8e"/>
    <rect x="256" y="444" width="52" height="52" fill="#d1495b"/>
    <rect x="308" y="444" width="52" height="52" fill="#8c1d2f"/>
    <rect x="204" y="496" width="52" height="52" fill="#d1495b"/>
    <rect x="256" y="496" width="52" height="52" fill="#c7d2e5"/>
    <rect x="308" y="392" width="52" height="52" fill="#9fb3d1"/>
    <rect x="152" y="496" width="52" height="52" fill="#7f97bf"/>
    <rect x="360" y="496" width="52" height="52" fill="#e8eaf0"/>
    <rect x="880" y="420" width="52" height="52" fill="#9fb3d1"/>
    <rect x="932" y="420" width="52" height="52" fill="#d1495b"/>
    <rect x="932" y="472" width="52" height="52" fill="#a56b8e"/>
    <rect x="984" y="472" width="52" height="52" fill="#c7d2e5"/>
    <rect x="1100" y="430" width="52" height="52" fill="#7f97bf"/>
    <rect x="1152" y="430" width="52" height="52" fill="#d1495b"/>
    <rect x="1152" y="482" width="52" height="52" fill="#9fb3d1"/>
    <rect x="1204" y="482" width="52" height="52" fill="#e8eaf0"/>
  </g>
  <text class="t" x="700" y="520" fill="#52525b">Mapa municipal · celdas de 500 m · zoom 12</text>
  <text class="t" x="628" y="544" fill="#94a3b8">[ el encuadre NO cambia la estadística de arriba ]</text>

  <!-- leyenda -->
  <rect class="card" x="24" y="384" width="300" height="152" rx="6"/>
  <text class="lbl" x="44" y="410">Leyenda</text>
  <rect x="44" y="424" width="16" height="16" fill="#d1495b"/><text class="t" x="70" y="437">Terminados después de 1987</text>
  <rect x="44" y="450" width="16" height="16" fill="#7f97bf"/><text class="t" x="70" y="463">Ya existían en 1987</text>
  <rect x="44" y="476" width="16" height="16" fill="#e8eaf0"/><text class="t" x="70" y="489">Década dominante anterior a 1900</text>
  <rect x="44" y="502" width="16" height="16" fill="#f6f7f9" stroke="#18181b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="t" x="70" y="515">Pocos edificios con año en la celda</text>
  <text class="t" x="44" y="531" fill="#52525b" font-size="12">La celda colorea la cuota de EDIFICIOS posteriores a 1987.</text>

  <!-- distribución -->
  <rect class="band" x="0" y="656" width="1440" height="192"/>
  <text class="lbl" x="120" y="684">Edificios actuales de Leioa por periodo de construcción</text>

  <g>
    <!-- <1900 -->
    <rect class="bar-old" x="120" y="768" width="28" height="44"/>
    <!-- 1900s..2020s -->
    <rect class="bar-before" x="160" y="802" width="28" height="10"/>
    <rect class="bar-before" x="200" y="798" width="28" height="14"/>
    <rect class="bar-before" x="240" y="786" width="28" height="26"/>
    <rect class="bar-before" x="280" y="796" width="28" height="16"/>
    <rect class="bar-before" x="320" y="792" width="28" height="20"/>
    <rect class="bar-before" x="360" y="772" width="28" height="40"/>
    <rect class="bar-before" x="400" y="750" width="28" height="62"/>
    <rect class="bar-before" x="440" y="734" width="28" height="78"/>
    <rect class="bar-before" x="480" y="768" width="28" height="44"/>
    <rect class="bar-after" x="520" y="746" width="28" height="66"/>
    <rect class="bar-after" x="560" y="742" width="28" height="70"/>
    <rect class="bar-after" x="600" y="778" width="28" height="34"/>
    <rect class="bar-after" x="640" y="794" width="28" height="18"/>
    <!-- SIN AÑO, separado -->
    <rect class="bar-none" x="740" y="806" width="28" height="6"/>
    <rect x="740" y="806" width="28" height="6" fill="none" stroke="#18181b" stroke-width="1.2" stroke-dasharray="3 2"/>
  </g>

  <!-- marcador continuo -->
  <line x1="468" y1="712" x2="468" y2="820" stroke="#18181b" stroke-width="2"/>
  <text class="t" x="476" y="712" font-weight="700">TU AÑO · 1987</text>

  <!-- etiquetas de eje -->
  <text class="ax" x="120" y="830">antes</text>
  <text class="ax" x="120" y="842">de 1900</text>
  <text class="ax" x="160" y="830">1900s</text>
  <text class="ax" x="240" y="830">1920s</text>
  <text class="ax" x="320" y="830">1940s</text>
  <text class="ax" x="400" y="830">1960s</text>
  <text class="ax" x="480" y="830">1980s</text>
  <text class="ax" x="560" y="830">2000s</text>
  <text class="ax" x="640" y="830">2020s</text>
  <text class="ax" x="740" y="830">sin año</text>
  <text class="meta" x="120" y="866" font-size="13">sobre 2.385 edificios con año conocido · la línea marca tu año exacto; las barras son periodos</text>
  <text class="meta" x="120" y="886" font-size="13">Parte de las fechas catastrales acaban en 0 o 5 (aquí, 29 %), así que no leemos picos anuales como momentos de construcción.</text>

  <!-- anotaciones -->
  <g>
    <line class="anl" x1="60" y1="162" x2="112" y2="162"/><circle cx="46" cy="162" r="12" fill="#1d4ed8"/>
    <text x="46" y="167" text-anchor="middle" font="700 12px system-ui" fill="#fff">1</text>
    <line class="anl" x1="60" y1="308" x2="112" y2="308"/><circle cx="46" cy="308" r="12" fill="#1d4ed8"/>
    <text x="46" y="313" text-anchor="middle" font="700 12px system-ui" fill="#fff">2</text>
    <line class="anl" x1="60" y1="520" x2="14" y2="520"/><circle cx="46" cy="548" r="12" fill="#1d4ed8"/>
    <text x="46" y="553" text-anchor="middle" font="700 12px system-ui" fill="#fff">3</text>
    <line class="anl" x1="480" y1="690" x2="520" y2="690"/><circle cx="540" cy="690" r="12" fill="#1d4ed8"/>
    <text x="540" y="695" text-anchor="middle" font="700 12px system-ui" fill="#fff">4</text>
    <line class="anl" x1="800" y1="806" x2="838" y2="806"/><circle cx="852" cy="806" r="12" fill="#1d4ed8"/>
    <text x="852" y="811" text-anchor="middle" font="700 12px system-ui" fill="#fff">5</text>
  </g>

  <rect class="card" x="880" y="676" width="420" height="168" rx="6"/>
  <text class="ann" x="900" y="702" font-weight="700">Notas de diseño</text>
  <text class="ann" x="900" y="726">1  Titular en 1.ª persona. Una sola idea.</text>
  <text class="ann" x="900" y="750">2  Denominador y cobertura SIEMPRE juntos.</text>
  <text class="ann" x="900" y="774">3  El zoom no cambia la cifra: el mapa explora,</text>
  <text class="ann" x="916" y="792">el titular sigue diciendo “Leioa”.</text>
  <text class="ann" x="900" y="816">4  Buckets fijos: &lt;1900 + décadas + sin año (15).</text>
  <text class="ann" x="900" y="840">5  “sin año” fuera del eje temporal, nunca en 0.</text>

</svg>
