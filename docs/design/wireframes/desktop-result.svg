<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"
     aria-label="Wireframe desktop del resultado de Tu Bizkaia">
  <title>Wireframe · Desktop 1440×900 · Resultado (RESULT, celdas)</title>
  <style>
    .bg{fill:#f6f7f9}.card{fill:#ffffff;stroke:#d4d4d8;stroke-width:1}
    .band{fill:#ffffff;stroke:#e4e4e7;stroke-width:1}
    .h1{font:700 38px/1.15 Georgia,serif;fill:#18181b}
    .lead{font:20px/1.45 system-ui,sans-serif;fill:#27272a}
    .meta{font:15px/1.4 system-ui,sans-serif;fill:#52525b}
    .lbl{font:600 12px/1.2 system-ui,sans-serif;fill:#52525b;letter-spacing:.04em;text-transform:uppercase}
    .t{font:14px/1.3 system-ui,sans-serif;fill:#18181b}
    .ann{font:13px/1.3 system-ui,sans-serif;fill:#1d4ed8}
    .anl{stroke:#1d4ed8;stroke-width:1}
    .foot{font:12px/1.4 system-ui,sans-serif;fill:#52525b}
    .chip{font:14px/1 system-ui,sans-serif;fill:#18181b}
    .btn{fill:#18181b}.btnt{font:600 15px/1 system-ui,sans-serif;fill:#fff}
    .btn2{fill:#fff;stroke:#a1a1aa;stroke-width:1.2}
    .btn2t{font:600 15px/1 system-ui,sans-serif;fill:#18181b}
  </style>

  <rect class="bg" width="1440" height="900"/>

  <!-- header sticky -->
  <rect class="card" x="0" y="0" width="1440" height="64"/>
  <text class="t" x="48" y="39" font-weight="700" letter-spacing="0.06em">MÁS JOVEN QUE TÚ</text>
  <rect class="btn2" x="560" y="16" width="220" height="32" rx="16"/>
  <text class="chip" x="576" y="37">1987 · Leioa</text>
  <text class="chip" x="792" y="37" fill="#52525b">▾</text>
  <rect class="btn2" x="1290" y="16" width="110" height="32" rx="6"/>
  <text class="btn2t" x="1312" y="37">Compartir</text>

  <!-- banda editorial -->
  <rect class="band" x="0" y="64" width="1440" height="292"/>
  <text class="h1" x="120" y="140">Eres mayor que una parte de los edificios</text>
  <text class="h1" x="120" y="184">que hoy forman Leioa.</text>

  <text class="lead" x="120" y="234">Entre los edificios actuales cuyo año de construcción consta en Catastro,</text>
  <text class="lead" x="120" y="260"><tspan font-weight="700">47,6 de cada 100</tspan> se terminó después de 1987.</text>

  <text class="meta" x="120" y="298">Cobertura del dato: 2.385 de 2.390 edificios (99,8 %). La cifra se calcula solo sobre esos 2.385.</text>
  <text class="meta" x="120" y="320">· 0 sin año · 5 con año anómalo. El Catastro describe los edificios que existen hoy.</text>

  <text class="meta" x="120" y="344" fill="#1d4ed8" text-decoration="underline">¿Cómo se calcula?</text>

  <!-- banda de mapa -->
  <rect x="0" y="356" width="1440" height="360" fill="#eef1f5"/>
  <g opacity="0.85">
    <!-- celdas 500 m coloreadas -->
    <g stroke="#ffffff" stroke-width="1">
      <rect x="152" y="404" width="52" height="52" fill="#e8eaf0"/>
      <rect x="204" y="404" width="52" height="52" fill="#c7d2e5"/>
      <rect x="256" y="404" width="52" height="52" fill="#9fb3d1"/>
      <rect x="152" y="456" width="52" height="52" fill="#7f97bf"/>
      <rect x="204" y="456" width="52" height="52" fill="#a56b8e"/>
      <rect x="256" y="456" width="52" height="52" fill="#d1495b"/>
      <rect x="308" y="456" width="52" height="52" fill="#8c1d2f"/>
      <rect x="204" y="508" width="52" height="52" fill="#d1495b"/>
      <rect x="256" y="508" width="52" height="52" fill="#c7d2e5"/>
      <rect x="308" y="404" width="52" height="52" fill="#9fb3d1"/>
      <rect x="152" y="508" width="52" height="52" fill="#7f97bf"/>
      <rect x="360" y="508" width="52" height="52" fill="#e8eaf0"/>
      <rect x="880" y="430" width="52" height="52" fill="#9fb3d1"/>
      <rect x="932" y="430" width="52" height="52" fill="#d1495b"/>
      <rect x="932" y="482" width="52" height="52" fill="#a56b8e"/>
      <rect x="984" y="482" width="52" height="52" fill="#c7d2e5"/>
      <rect x="1100" y="440" width="52" height="52" fill="#7f97bf"/>
      <rect x="1152" y="440" width="52" height="52" fill="#d1495b"/>
      <rect x="1152" y="492" width="52" height="52" fill="#9fb3d1"/>
      <rect x="1204" y="492" width="52" height="52" fill="#e8eaf0"/>
    </g>
  </g>
  <text class="t" x="700" y="530" fill="#52525b">Mapa municipal · celdas de 500 m · zoom 12</text>
  <text class="t" x="640" y="556" fill="#94a3b8">[ el encuadre NO cambia la estadística de arriba ]</text>

  <!-- leyenda -->
  <rect class="card" x="24" y="384" width="300" height="128" rx="6"/>
  <text class="lbl" x="44" y="410">Leyenda</text>
  <rect x="44" y="424" width="16" height="16" fill="#d1495b"/><text class="t" x="70" y="437">Terminados después de 1987</text>
  <rect x="44" y="450" width="16" height="16" fill="#7f97bf"/><text class="t" x="70" y="463">Ya existían en 1987</text>
  <rect x="44" y="476" width="16" height="16" fill="#e8eaf0"/><text class="t" x="70" y="489">Década dominante anterior a 1900</text>
  <text class="t" x="44" y="505" fill="#52525b" font-size="12">La celda colorea la cuota de EDIFICIOS posteriores a 1987.</text>

  <!-- distribución -->
  <rect class="band" x="0" y="716" width="1440" height="132"/>
  <text class="lbl" x="120" y="748">Edificios actuales de Leioa por década</text>
  <g>
    <rect x="120" y="800" width="6" height="14" fill="#c7d2e5"/>
    <rect x="140" y="792" width="6" height="22" fill="#c7d2e5"/>
    <rect x="160" y="784" width="6" height="30" fill="#c7d2e5"/>
    <rect x="180" y="772" width="6" height="42" fill="#7f97bf"/>
    <rect x="200" y="754" width="6" height="60" fill="#7f97bf"/>
    <rect x="220" y="700" width="6" height="114" fill="#7f97bf"/>
    <rect x="240" y="760" width="6" height="54" fill="#7f97bf"/>
    <rect x="260" y="716" width="6" height="98" fill="#d1495b"/>
    <rect x="280" y="710" width="6" height="104" fill="#d1495b"/>
    <rect x="300" y="768" width="6" height="46" fill="#d1495b"/>
    <rect x="320" y="790" width="6" height="24" fill="#d1495b"/>
  </g>
  <line x1="248" y1="686" x2="248" y2="820" stroke="#18181b" stroke-width="2"/>
  <text class="t" x="256" y="688" font-weight="700">TU AÑO · 1987</text>
  <text class="meta" x="120" y="836">sobre 2.385 edificios con año conocido · décadas, no años: parte de las fechas catastrales acaban en 0 o 5 (aquí, 29 %)</text>

  <!-- teaser ortofoto -->
  <rect class="band" x="0" y="848" width="1440" height="52"/>
  <text class="meta" x="120" y="880">La foto aérea oficial más próxima a 1987 es de <tspan font-weight="700">1990</tspan> (a 3 años) · campaña Bizkaia 1990</text>
  <rect class="btn2" x="980" y="858" width="180" height="32" rx="6"/><text class="btn2t" x="1002" y="879">Ver la foto de 1990</text>
  <rect class="btn2" x="1176" y="858" width="164" height="32" rx="6"/><text class="btn2t" x="1198" y="879">Comparar con 2025</text>

  <!-- anotaciones -->
  <g>
    <line class="anl" x1="60" y1="162" x2="112" y2="162"/><circle cx="46" cy="162" r="12" fill="#1d4ed8"/>
    <text x="46" y="167" text-anchor="middle" font="700 12px system-ui" fill="#fff">1</text>
    <line class="anl" x1="60" y1="308" x2="112" y2="308"/><circle cx="46" cy="308" r="12" fill="#1d4ed8"/>
    <text x="46" y="313" text-anchor="middle" font="700 12px system-ui" fill="#fff">2</text>
    <line class="anl" x1="60" y1="600" x2="14" y2="600"/><circle cx="46" cy="620" r="12" fill="#1d4ed8"/>
    <text x="46" y="625" text-anchor="middle" font="700 12px system-ui" fill="#fff">3</text>
    <line class="anl" x1="420" y1="782" x2="470" y2="782"/><circle cx="434" cy="782" r="12" fill="#1d4ed8"/>
    <text x="434" y="787" text-anchor="middle" font="700 12px system-ui" fill="#fff">4</text>
    <line class="anl" x1="1380" y1="874" x2="1352" y2="874"/><circle cx="1394" cy="874" r="12" fill="#1d4ed8"/>
    <text x="1394" y="879" text-anchor="middle" font="700 12px system-ui" fill="#fff">5</text>
  </g>

  <rect class="card" x="470" y="140" width="420" height="176" rx="6"/>
  <text class="ann" x="490" y="168" font-weight="700">Notas de diseño</text>
  <text class="ann" x="490" y="194">1  Titular en 1.ª persona. Una sola idea.</text>
  <text class="ann" x="490" y="220">2  Denominador y cobertura SIEMPRE juntos.</text>
  <text class="ann" x="490" y="246">3  El zoom no cambia la cifra. El mapa</text>
  <text class="ann" x="506" y="264">explora; el titular sigue diciendo “Leioa”.</text>
  <text class="ann" x="490" y="290">4  Décadas, no años. Marcador del año exacto.</text>
  <text class="ann" x="490" y="310">5  Ortofoto opt-in: no se carga sola.</text>

</svg>
