<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"
     aria-label="Wireframe desktop del detalle de edificio">
  <title>Wireframe · Desktop 1440×900 · Zoom de edificio (EDIFICIO)</title>
  <style>
    .bg{fill:#f6f7f9}.card{fill:#ffffff;stroke:#d4d4d8;stroke-width:1}
    .band{fill:#ffffff;stroke:#e4e4e7;stroke-width:1}
    .h2{font:700 26px/1.2 Georgia,serif;fill:#18181b}
    .t{font:14px/1.35 system-ui,sans-serif;fill:#18181b}
    .lbl{font:600 12px/1.2 system-ui,sans-serif;fill:#52525b;letter-spacing:.04em;text-transform:uppercase}
    .meta{font:14px/1.4 system-ui,sans-serif;fill:#52525b}
    .ann{font:13px/1.3 system-ui,sans-serif;fill:#1d4ed8}
    .anl{stroke:#1d4ed8;stroke-width:1}
    .foot{font:12px/1.4 system-ui,sans-serif;fill:#52525b}
    .btn2{fill:#fff;stroke:#a1a1aa;stroke-width:1.2}
    .btn2t{font:600 15px/1 system-ui,sans-serif;fill:#18181b}
  </style>
  <rect class="bg" width="1440" height="900"/>

  <rect class="card" x="0" y="0" width="1440" height="64"/>
  <text class="t" x="48" y="39" font-weight="700" letter-spacing="0.06em">MÁS JOVEN QUE TÚ</text>
  <rect class="btn2" x="560" y="16" width="220" height="32" rx="16"/>
  <text x="576" y="37" class="t">1987 · Leioa</text>
  <text class="meta" x="820" y="37">zoom 15 · nivel EDIFICIO</text>

  <!-- mapa con edificios -->
  <rect x="0" y="64" width="1010" height="836" fill="#eef1f5"/>
  <g>
    <!-- manzana -->
    <g stroke="#ffffff" stroke-width="1.2">
      <rect x="120" y="180" width="86" height="70" fill="#7f97bf"/>
      <rect x="212" y="180" width="74" height="70" fill="#d1495b"/>
      <rect x="292" y="180" width="96" height="70" fill="#7f97bf"/>
      <rect x="120" y="258" width="86" height="88" fill="#7f97bf"/>
      <rect x="212" y="258" width="74" height="88" fill="#d1495b"/>
      <rect x="292" y="258" width="96" height="88" fill="#7f97bf"/>
      <rect x="120" y="354" width="86" height="64" fill="#d1495b"/>
      <rect x="212" y="354" width="74" height="64" fill="#7f97bf"/>
      <rect x="292" y="354" width="96" height="64" fill="#d1495b"/>
      <rect x="420" y="200" width="130" height="110" fill="#7f97bf"/>
      <rect x="560" y="200" width="90" height="110" fill="#d1495b"/>
      <rect x="420" y="330" width="230" height="90" fill="#d1495b"/>
      <rect x="700" y="240" width="150" height="120" fill="#7f97bf"/>
      <rect x="700" y="380" width="150" height="90" fill="#d1495b"/>
      <!-- UNKNOWN con trama discontinua -->
      <rect x="212" y="430" width="74" height="46" fill="#e8eaf0" stroke="#18181b" stroke-width="1.6" stroke-dasharray="5 4"/>
      <rect x="420" y="440" width="90" height="46" fill="#e8eaf0" stroke="#18181b" stroke-width="1.6" stroke-dasharray="5 4"/>
    </g>
    <rect x="212" y="258" width="74" height="88" fill="none" stroke="#18181b" stroke-width="3"/>
    <text class="t" x="120" y="520" font-size="16" fill="#52525b">z15 · edificios individuales · algunos con trama = año no utilizable</text>
  </g>

  <!-- tarjeta de edificio -->
  <rect class="card" x="1034" y="96" width="374" height="300" rx="6"/>
  <text class="lbl" x="1058" y="126">Edificio seleccionado</text>
  <text class="h2" x="1058" y="160">Terminado en 1998</text>
  <text class="meta" x="1058" y="190">Este edificio consta como terminado en Catastro en 1998.</text>
  <line x1="1058" y1="210" x2="1384" y2="210" stroke="#e4e4e7"/>
  <text class="t" x="1058" y="240">Uso catastral<tspan x="1280" font-weight="700">V · vivienda</tspan></text>
  <text class="t" x="1058" y="268">Alturas sobre rasante<tspan x="1280" font-weight="700">7</tspan></text>
  <text class="t" x="1058" y="296">Huella en planta<tspan x="1280" font-weight="700">412 m²</tspan></text>
  <text class="t" x="1058" y="324">Estado del dato<tspan x="1280" font-weight="700">VÁLIDO</tspan></text>
  <line x1="1058" y1="342" x2="1384" y2="342" stroke="#e4e4e7"/>
  <text class="meta" x="1058" y="366" font-size="12">Huella en planta. No es superficie construida.</text>
  <text class="meta" x="1058" y="384" font-size="12">¿Cómo se calcula?</text>

  <!-- caso desconocido -->
  <rect class="card" x="1034" y="416" width="374" height="150" rx="6"/>
  <text class="lbl" x="1058" y="446">Ejemplo · sin año utilizable</text>
  <text class="h2" x="1058" y="478" font-size="21">Año no consta</text>
  <text class="meta" x="1058" y="504" font-size="13">El Catastro no indica un año de construcción para este edificio.</text>
  <text class="meta" x="1058" y="524" font-size="13">Por eso no cuenta en la cifra personal ni en la cobertura.</text>
  <text class="meta" x="1058" y="548" font-size="13">Se dibuja con trama: nunca en blanco, nunca como 0.</text>

  <!-- leyenda -->
  <rect class="card" x="1034" y="586" width="374" height="142" rx="6"/>
  <text class="lbl" x="1058" y="614">Leyenda (nivel edificio)</text>
  <rect x="1058" y="628" width="16" height="16" fill="#d1495b"/><text class="t" x="1084" y="641">Terminado después de 1987</text>
  <rect x="1058" y="654" width="16" height="16" fill="#7f97bf"/><text class="t" x="1084" y="667">Ya existía en 1987</text>
  <rect x="1058" y="680" width="16" height="16" fill="#e8eaf0" stroke="#18181b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text class="t" x="1084" y="693">Año no utilizable (sin dato o anómalo)</text>
  <text class="meta" x="1058" y="716" font-size="12">El número exacto de “sin dato” y “anómalo” está arriba.</text>

  <!-- anotaciones -->
  <g>
    <line class="anl" x1="1010" y1="300" x2="1030" y2="300"/><circle cx="1022" cy="286" r="12" fill="#1d4ed8"/>
    <text x="1022" y="291" text-anchor="middle" font="700 12px system-ui" fill="#fff">1</text>
    <line class="anl" x1="1010" y1="470" x2="1030" y2="470"/><circle cx="1022" cy="500" r="12" fill="#1d4ed8"/>
    <text x="1022" y="505" text-anchor="middle" font="700 12px system-ui" fill="#fff">2</text>
  </g>
  <rect class="card" x="640" y="600" width="346" height="120" rx="6"/>
  <text class="ann" x="660" y="628" font-weight="700">Notas</text>
  <text class="ann" x="660" y="654">1  El detalle vive fuera del canvas: es la</text>
  <text class="ann" x="676" y="672">alternativa accesible del mapa.</text>
  <text class="ann" x="660" y="698">2  Los estados no utilizables se explican,</text>
  <text class="ann" x="676" y="716">no se esconden ni se pintan como 0.</text>
</svg>
