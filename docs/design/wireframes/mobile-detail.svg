<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img"
     aria-label="Wireframe móvil del detalle de ortofoto y de edificio">
  <title>Wireframe · Móvil 390×844 · Detalle: ortofoto (NOT_COVERED) y edificio</title>
  <style>
    .bg{fill:#f6f7f9}.card{fill:#fff;stroke:#d4d4d8;stroke-width:1}
    .sheet{fill:#fff;stroke:#d4d4d8;stroke-width:1}
    .h2{font:700 20px/1.2 Georgia,serif;fill:#18181b}
    .meta{font:12px/1.4 system-ui,sans-serif;fill:#52525b}
    .lbl{font:600 11px/1.2 system-ui,sans-serif;fill:#52525b;letter-spacing:.04em;text-transform:uppercase}
    .t{font:12px/1.35 system-ui,sans-serif;fill:#18181b}
    .ann{font:11px/1.35 system-ui,sans-serif;fill:#1d4ed8}
    .anl{stroke:#1d4ed8;stroke-width:1}
    .foot{font:10px/1.4 system-ui,sans-serif;fill:#52525b}
    .btn2{fill:#fff;stroke:#a1a1aa;stroke-width:1.2}
    .btn2t{font:600 13px/1 system-ui,sans-serif;fill:#18181b}
    .warnBox{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
  </style>
  <rect class="bg" width="390" height="844"/>

  <rect class="card" x="0" y="0" width="390" height="52"/>
  <text class="t" x="16" y="32" font-weight="700" letter-spacing="0.05em" font-size="12">MÁS JOVEN QUE TÚ</text>
  <rect class="btn2" x="216" y="12" width="104" height="28" rx="14"/>
  <text class="t" x="228" y="31" font-size="12">1987 · Leioa</text>

  <!-- mapa con swipe -->
  <rect x="0" y="52" width="390" height="356" fill="#dfe5ec"/>
  <g opacity="0.5">
    <path d="M30 200 q80 -30 160 -10 q90 24 170 -18" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M60 120 q60 60 20 150" stroke="#94a3b8" stroke-width="10" fill="none"/>
    <path d="M250 90 q-40 90 30 230" stroke="#94a3b8" stroke-width="10" fill="none"/>
  </g>
  <g opacity="0.85">
    <rect x="40" y="150" width="60" height="50" fill="#7f97bf" stroke="#fff"/>
    <rect x="100" y="150" width="60" height="50" fill="#d1495b" stroke="#fff"/>
    <rect x="40" y="200" width="60" height="50" fill="#d1495b" stroke="#fff"/>
  </g>
  <line x1="200" y1="52" x2="200" y2="408" stroke="#18181b" stroke-width="3"/>
  <circle cx="200" cy="230" r="18" fill="#fff" stroke="#18181b" stroke-width="2"/>
  <text x="200" y="236" text-anchor="middle" font="700 14px system-ui" fill="#18181b">⇄</text>
  <text class="t" x="20" y="76" font-size="11" fill="#18181b">◀ Campaña 1990</text>
  <text class="t" x="300" y="76" font-size="11" fill="#18181b">2025 ▶</text>
  <text class="t" x="20" y="392" font-size="10" fill="#3f3f46">Open Data Bizkaia (CC BY 4.0) · geoEuskadi (CC BY 4.0)</text>

  <!-- bottom sheet: NOT_COVERED -->
  <rect class="sheet" x="0" y="396" width="390" height="448" rx="14"/>
  <rect x="170" y="408" width="50" height="4" rx="2" fill="#a1a1aa"/>

  <text class="lbl" x="20" y="442">Estado de la ortofoto · ejemplo NOT_COVERED</text>
  <rect class="warnBox" x="20" y="452" width="350" height="86" rx="8"/>
  <text class="h2" x="36" y="480" font-size="17">La campaña de 1975 no cubre este lugar.</text>
  <text class="meta" x="36" y="502" font-size="11">Puedes probar 1970 o 1983: son las campañas más cercanas</text>
  <text class="meta" x="36" y="518" font-size="11">que sí cubren este punto (comprobado, no supuesto).</text>

  <rect class="btn2" x="20" y="548" width="100" height="32" rx="6"/><text class="btn2t" x="40" y="569">Probar 1970</text>
  <rect class="btn2" x="128" y="548" width="100" height="32" rx="6"/><text class="btn2t" x="148" y="569">Probar 1983</text>
  <rect class="btn2" x="236" y="548" width="134" height="32" rx="6"/><text class="btn2t" x="254" y="569">Cerrar la ortofoto</text>

  <text class="meta" x="20" y="606" font-size="11">El resultado y la cifra personal siguen disponibles: la ortofoto es contexto, no la respuesta.</text>

  <line x1="20" y1="624" x2="370" y2="624" stroke="#e4e4e7"/>

  <text class="lbl" x="20" y="652">Edificio seleccionado · ejemplo</text>
  <text class="h2" x="20" y="680" font-size="17">Terminado en 1998</text>
  <text class="meta" x="20" y="702" font-size="11">Este edificio consta como terminado en Catastro en 1998.</text>
  <text class="t" x="20" y="728" font-size="11">Uso: vivienda · Alturas: 7 · Huella: 412 m²</text>
  <text class="meta" x="20" y="748" font-size="10">Huella en planta. No es superficie construida.</text>

  <line x1="20" y1="766" x2="370" y2="766" stroke="#e4e4e7"/>
  <text class="lbl" x="20" y="792">Otros dos estados posibles</text>
  <text class="ann" x="20" y="812">AVAILABLE → se muestra la imagen, con fuente y fecha real del vuelo.</text>
  <text class="ann" x="20" y="830">SERVICE_ERROR → “La ortofoto oficial no está disponible temporalmente.</text>
  <text class="ann" x="36" y="844">El resto de la visualización sigue funcionando.” + Reintentar</text>

</svg>
