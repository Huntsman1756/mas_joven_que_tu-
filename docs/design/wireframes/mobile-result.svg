<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img"
     aria-label="Wireframe móvil del resultado con bottom sheet">
  <title>Wireframe · Móvil 390×844 · Resultado (celdas + bottom sheet)</title>
  <style>
    .bg{fill:#f6f7f9}.card{fill:#fff;stroke:#d4d4d8;stroke-width:1}
    .sheet{fill:#fff;stroke:#d4d4d8;stroke-width:1}
    .h2{font:700 24px/1.2 Georgia,serif;fill:#18181b}
    .lead{font:16px/1.45 system-ui,sans-serif;fill:#27272a}
    .meta{font:12px/1.4 system-ui,sans-serif;fill:#52525b}
    .lbl{font:600 11px/1.2 system-ui,sans-serif;fill:#52525b;letter-spacing:.04em;text-transform:uppercase}
    .t{font:12px/1.35 system-ui,sans-serif;fill:#18181b}
    .ann{font:11px/1.35 system-ui,sans-serif;fill:#1d4ed8}
    .anl{stroke:#1d4ed8;stroke-width:1}
    .foot{font:10px/1.4 system-ui,sans-serif;fill:#52525b}
    .btn2{fill:#fff;stroke:#a1a1aa;stroke-width:1.2}
    .btn2t{font:600 13px/1 system-ui,sans-serif;fill:#18181b}
  </style>
  <rect class="bg" width="390" height="844"/>

  <!-- header -->
  <rect class="card" x="0" y="0" width="390" height="52"/>
  <text class="t" x="16" y="32" font-weight="700" letter-spacing="0.05em" font-size="12">MÁS JOVEN QUE TÚ</text>
  <rect class="btn2" x="216" y="12" width="104" height="28" rx="14"/>
  <text class="t" x="228" y="31" font-size="12">1987 · Leioa</text>
  <text class="t" x="332" y="31" font-size="12" fill="#52525b">Compartir</text>

  <!-- titular -->
  <text class="h2" x="20" y="96">Eres mayor que una</text>
  <text class="h2" x="20" y="124">parte de los edificios</text>
  <text class="h2" x="20" y="152">de Leioa.</text>

  <text class="lead" x="20" y="188">Entre los edificios actuales cuyo año</text>
  <text class="lead" x="20" y="210">consta en Catastro, <tspan font-weight="700">47,6 de cada 100</tspan></text>
  <text class="lead" x="20" y="232">se terminó después de 1987.</text>
  <text class="meta" x="20" y="258">2.385 de 2.390 con año conocido (99,8 %) · 0 sin año · 5 anómalos</text>
  <text class="meta" x="20" y="276" fill="#1d4ed8">¿Cómo se calcula?</text>

  <!-- mapa -->
  <rect x="0" y="296" width="390" height="300" fill="#eef1f5"/>
  <g stroke="#ffffff" stroke-width="1">
    <rect x="24" y="330" width="46" height="46" fill="#7f97bf"/>
    <rect x="70" y="330" width="46" height="46" fill="#d1495b"/>
    <rect x="116" y="330" width="46" height="46" fill="#c7d2e5"/>
    <rect x="24" y="376" width="46" height="46" fill="#d1495b"/>
    <rect x="70" y="376" width="46" height="46" fill="#9fb3d1"/>
    <rect x="116" y="376" width="46" height="46" fill="#d1495b"/>
    <rect x="162" y="376" width="46" height="46" fill="#e8eaf0"/>
    <rect x="24" y="422" width="46" height="46" fill="#c7d2e5"/>
    <rect x="70" y="422" width="46" height="46" fill="#8c1d2f"/>
    <rect x="116" y="422" width="46" height="46" fill="#7f97bf"/>
    <rect x="268" y="360" width="46" height="46" fill="#d1495b"/>
    <rect x="314" y="360" width="46" height="46" fill="#9fb3d1"/>
    <rect x="268" y="406" width="46" height="46" fill="#c7d2e5"/>
    <rect x="314" y="406" width="46" height="46" fill="#d1495b"/>
  </g>
  <rect class="card" x="16" y="312" width="150" height="76" rx="6"/>
  <rect x="28" y="324" width="12" height="12" fill="#d1495b"/><text class="t" x="48" y="335" font-size="11">Después de 1987</text>
  <rect x="28" y="344" width="12" height="12" fill="#7f97bf"/><text class="t" x="48" y="355" font-size="11">Ya existían</text>
  <rect x="28" y="364" width="12" height="12" fill="#e8eaf0"/><text class="t" x="48" y="375" font-size="11">No utilizable</text>

  <!-- bottom sheet -->
  <rect class="sheet" x="0" y="560" width="390" height="284" rx="14"/>
  <rect x="170" y="572" width="50" height="4" rx="2" fill="#a1a1aa"/>

  <text class="lbl" x="20" y="606">Edificios actuales de Leioa por década</text>
  <g>
    <rect x="20" y="656" width="10" height="18" fill="#c7d2e5"/>
    <rect x="36" y="646" width="10" height="28" fill="#c7d2e5"/>
    <rect x="52" y="632" width="10" height="42" fill="#7f97bf"/>
    <rect x="68" y="606" width="10" height="68" fill="#7f97bf"/>
    <rect x="84" y="648" width="10" height="26" fill="#7f97bf"/>
    <rect x="100" y="614" width="10" height="60" fill="#d1495b"/>
    <rect x="116" y="608" width="10" height="66" fill="#d1495b"/>
    <rect x="132" y="652" width="10" height="22" fill="#d1495b"/>
  </g>
  <line x1="93" y1="596" x2="93" y2="680" stroke="#18181b" stroke-width="2"/>
  <text class="t" x="100" y="596" font-size="11" font-weight="700">TU AÑO · 1987</text>
  <text class="meta" x="20" y="700" font-size="11">sobre 2.385 edificios con año conocido. Décadas, no años.</text>

  <text class="meta" x="20" y="732" font-size="12">La foto aérea oficial más próxima a 1987 es de 1990.</text>
  <rect class="btn2" x="20" y="744" width="170" height="34" rx="6"/>
  <text class="btn2t" x="38" y="766">Ver la foto de 1990</text>
  <rect class="btn2" x="200" y="744" width="170" height="34" rx="6"/>
  <text class="btn2t" x="218" y="766">Comparar con 2025</text>
  <text class="meta" x="20" y="800" font-size="10">Fuente: Open Data Bizkaia (CC BY 4.0) · geoEuskadi (CC BY 4.0)</text>

  <g>
    <line class="anl" x1="286" y1="180" x2="300" y2="180"/><circle cx="316" cy="180" r="11" fill="#1d4ed8"/>
    <text x="316" y="185" text-anchor="middle" font="700 11px system-ui" fill="#fff">1</text>
    <line class="anl" x1="360" y1="360" x2="372" y2="360"/><circle cx="372" cy="392" r="11" fill="#1d4ed8"/>
    <text x="372" y="397" text-anchor="middle" font="700 11px system-ui" fill="#fff">2</text>
    <line class="anl" x1="200" y1="612" x2="228" y2="612"/><circle cx="242" cy="612" r="11" fill="#1d4ed8"/>
    <text x="242" y="617" text-anchor="middle" font="700 11px system-ui" fill="#fff">3</text>
    <line class="anl" x1="360" y1="762" x2="374" y2="762"/><circle cx="376" cy="730" r="11" fill="#1d4ed8"/>
    <text x="376" y="735" text-anchor="middle" font="700 11px system-ui" fill="#fff">4</text>
  </g>
  <text class="ann" x="252" y="212">1  Denominador siempre visible</text>
  <text class="ann" x="252" y="228">junto a la cifra.</text>
  <text class="ann" x="252" y="420">2  El encuadre no cambia el universo.</text>
  <text class="ann" x="252" y="436">El titular sigue siendo “Leioa”.</text>
  <text class="ann" x="252" y="632">3  Una sola distribución, por décadas.</text>
  <text class="ann" x="252" y="720">4  Ortofoto opt-in, nunca automática.</text>

</svg>
