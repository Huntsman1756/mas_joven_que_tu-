name: Published release QA

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Expected published source SHA
        required: true
      pages_sha:
        description: Immutable gh-pages commit to capture
        required: true

permissions:
  contents: read

jobs:
  public-and-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --user 1001 --ipc=host
    env:
      EXPECTED_BUILD: ${{ inputs.source_sha }}
      PAGES_COMMIT: ${{ inputs.pages_sha }}
    steps:
      - name: Validate immutable identities
        run: |
          [[ "$EXPECTED_BUILD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PAGES_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pages_sha }}
          path: app/build
      - name: Check captured build identity
        run: |
          node --input-type=module -e "import {readFile} from 'node:fs/promises'; import assert from 'node:assert/strict'; const stamp=html=>/name=\"mjt:build\"\s+content=\"([^\"]+)\"/.exec(html)?.[1]; assert.equal(stamp(await readFile('app/build/index.html','utf8')),process.env.EXPECTED_BUILD); const response=await fetch('https://huntsman1756.github.io/mas_joven_que_tu-/',{signal:AbortSignal.timeout(30000)}); assert.ok(response.ok); assert.equal(stamp(await response.text()),process.env.EXPECTED_BUILD);"
      - id: marker
        run: touch /tmp/release-qa-start
      - name: Published navigation, touch, locale and accessibility
        working-directory: app
        env:
          NAV_BASE: https://huntsman1756.github.io/mas_joven_que_tu-/
          NAV_OUT: ../evidence/release-navigation-ci
        run: xvfb-run -a node scripts/map-navigation-qa.mjs --headed
      - name: Published reading and typography
        working-directory: app
        env:
          READING_BASE: https://huntsman1756.github.io/mas_joven_que_tu-/
          READING_OUT: ../evidence/release-reading-ci
        run: xvfb-run -a node scripts/reading-qa.mjs --headed
      - name: Published official raster content
        working-directory: app
        run: node scripts/smoke_public.mjs
      - name: Capture immutable published build with official services
        working-directory: app
        env:
          CAPTURE_BASE: https://huntsman1756.github.io/mas_joven_que_tu-/
        run: node scripts/capture-submission.mjs
      - name: Gather only new public smoke evidence
        if: always() && steps.marker.outcome == 'success'
        run: |
          mkdir -p .release-qa
          find evidence/public-smoke -type f -newer /tmp/release-qa-start -exec cp --parents {} .release-qa/ \;
          find docs/submission/media -type f -newer /tmp/release-qa-start -exec cp --parents {} .release-qa/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-release-qa
          path: |
            evidence/release-navigation-ci/
            evidence/release-reading-ci/
            .release-qa/
          retention-days: 14
          if-no-files-found: error
