name: CI

on:
  push:
  pull_request:

jobs:
  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt -c pipeline/constraints-release.txt
      - run: python -m pytest tests/data -q
      - name: Callejero contra snapshot fijado (regresión determinista)
        run: python scripts/verify_street_source.py
      - name: Callejero contra fuente viva (actualidad del proveedor — informa, no bloquea)
        continue-on-error: true
        run: python scripts/verify_street_source.py --live

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # HTTP Range contract (PMTiles lo exige): sobre un .pmtiles real,
      # con Content-Range y longitud correcta, no solo el 206 de un JSON.
      # Los .pmtiles del pipeline no se versionan — se sirve el fixture
      # real de scripts/fixtures/data/ y se exige octet-stream para que el
      # fallback index.html no pueda dar un falso 206.
      - run: |
          node scripts/static-server.mjs 4173 scripts/fixtures &
          sleep 1
          hdrs=$(curl -s -D - -o /dev/null -H 'Range: bytes=0-99' http://localhost:4173/data/cells.pmtiles)
          echo "$hdrs" | head -8
          echo "$hdrs" | grep -q '206'
          echo "$hdrs" | grep -qi 'Content-Range: bytes 0-99/'
          echo "$hdrs" | grep -qi 'Content-Type: application/octet-stream'
          body=$(curl -s -H 'Range: bytes=0-99' http://localhost:4173/data/cells.pmtiles | wc -c)
          test "$body" = "100"

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Marcador temporal: los scripts E2E escriben en evidence/, que ya
      # contiene evidencia histórica versionada — solo lo producido en
      # ESTE run se sube como artefacto (RT-17).
      - run: touch /tmp/ci-run-start
      # Subset estable: servicios externos (ortofotos, NORA, mapa base)
      # stubbados con CI_STUBS=1 — estas pruebas miden la app, no la
      # disponibilidad de terceros. Cada script sale con != 0 si falla
      # cualquier check o hay un pageerror inesperado.
      - name: E2E estable (fixtures locales + stubs externos)
        env:
          CI_STUBS: "1"
        run: |
          node scripts/g5_swipe.mjs
          node scripts/g10_hardening.mjs
          node scripts/g12_reliability.mjs
          node scripts/g13_ux.mjs
          node scripts/g14_eu_qa.mjs
          node scripts/g8_viewer.mjs
          node scripts/g2b_views.mjs
          node scripts/g18_timeplayer.mjs
          node scripts/perf4_deeplink_race.mjs
      # Solo ficheros de ESTE run (posteriores al marcador): el checkout
      # trae evidence/ versionada — subirla entera costaba ~573 MB por
      # fallo sin aportar diagnóstico nuevo.
      - name: Recoger evidencia del run
        if: failure()
        run: |
          cd ..
          mkdir -p .ci-evidence
          find evidence -type f -newer /tmp/ci-run-start -exec cp --parents {} .ci-evidence/ \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-evidence
          path: .ci-evidence/
          retention-days: 14
          if-no-files-found: warn

  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Motores y perfiles móviles (servicios externos simulados)
        run: node scripts/competition-matrix.mjs --out=../evidence/competition-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-matrix
          path: evidence/competition-ci/
          retention-days: 14
          if-no-files-found: error
