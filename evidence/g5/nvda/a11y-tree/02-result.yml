- link "Saltar al contenido":
  - /url: "#main"
- main:
  - text: Más joven que tú
  - button "Cambiar año o lugar"
  - button "Compartir esta vista"
  - heading "Eres mayor que el 47,6 % de los edificios que hoy forman Leioa." [level=1]
  - paragraph: "Es decir: casi 5 de cada 10 edificios actuales de Leioa son más jóvenes que tú."
  - paragraph: De los 2385 edificios actuales con año registrado en Catastro, 1135 se terminaron después de 1987.
  - paragraph: Leioa tiene hoy 32.495 habitantes empadronados (Eustat, padrón de 2025).
  - paragraph: Hay año registrado para 2385 de los 2390 edificios actuales (99,8 %); la cifra se calcula solo sobre esos. Otros 5 registran un año anómalo.
  - paragraph: En Leioa hay 2390 edificios actuales; 2385 tienen año conocido y 1135 se terminaron después de 1987.
  - region "Mapa de edificios actuales por estado temporal respecto a tu año.":
    - button "Ver datos de esta zona"
    - paragraph: Cada celda colorea la cuota de edificios posteriores a 1987
    - paragraph: menos más posteriores
    - paragraph: Estadística del municipio de Leioa. El encuadre del mapa no la cambia.
    - 'region "Mapa principal: edificios actuales por estado temporal"'
    - button "Zoom in"
    - button "Zoom out"
    - text: 1 km
  - navigation "Vista del mapa":
    - text: Leer el dato
    - group "Leer el dato":
      - button "Edificios"
      - button "En el tiempo"
    - text: Comprobar con otras fuentes
    - group "Comprobar con otras fuentes":
      - button "Con fotos aéreas"
      - button "Con el mapa de 1923–25"
  - paragraph: "El tiempo de esta pieza es el año de construcción registrado en Catastro. Las fotos aéreas y el mapa de 1923–25 son otras fuentes para comprobarlo con tus ojos: no miden fechas."
  - 'region "Eje temporal: incorporación del parque actual por año registrado"':
    - button "Reproducir"
    - button "Reiniciar desde 1987"
    - slider "Año en reproducción": "1987"
    - text: 1900 1920 1940 1960 1980 2000 2020
    - paragraph: Así se incorpora al mapa el parque que existe hoy según el año de construcción registrado en Catastro. Sobre los edificios actuales con año conocido.
    - status