  - region "Qué más sabemos del lugar":
    - heading "Qué más sabemos del lugar" [level=2]
    - paragraph: Leioa tenía 32.495 habitantes a 1 de enero de 2025 (Eustat, padrón municipal). En el censo de 1986 contaba con 24.560 habitantes (Eustat, población de hecho).
    - paragraph: "A fecha de 2026-08-04, el planeamiento vigente registra en Leioa: 1858 viviendas pendientes de ejecución; 36,1 ha de suelo residencial vacante; 33,5 ha de suelo de actividad económica vacante."
    - group: Qué significa
  - region "Para seguir leyendo":
    - heading "Para seguir leyendo" [level=2]
    - region "Cinco lugares de Bizkaia":
      - heading "Cinco lugares de Bizkaia" [level=2]
      - paragraph: Cinco conjuntos de edificios donde el mismo dato cuenta historias distintas. Cada capítulo configura el mapa para verlo; tu año y tu lugar se conservan aparte.
      - list:
        - listitem:
          - button "1 Margen izquierda · seis municipios · 1960–1969 Un patrón de los sesenta cruza seis municipios"
        - listitem:
          - button "2 Mungia · un conjunto de 70 edificios · 1970–1979 Muchos edificios posteriores, muy poca huella"
        - listitem:
          - button "3 Muskiz · un conjunto de 51 edificios · 1970–1979 Un conjunto entero construido en una década"
        - listitem:
          - button "4 Santurtzi · un conjunto de 54 edificios · 1990–1999 Pocos edificios concentran casi toda la huella"
        - listitem:
          - button "5 Abanto Zierbena · un conjunto de 69 edificios · 2000–2009 El caso más reciente de los cinco"
