  - region "Qué más sabemos del lugar":
    - heading "Qué más sabemos del lugar" [level=2]
    - paragraph: Portugalete tenía 45.150 habitantes a 1 de enero de 2025 (Eustat, padrón municipal). En el censo de 1970 contaba con 45.589 habitantes (Eustat, población de hecho).
    - paragraph: "A fecha de 2026-08-04, el planeamiento vigente registra en Portugalete: 1347 viviendas pendientes de ejecución; 15,5 ha de suelo residencial vacante; 11,7 ha de suelo de actividad económica vacante."
    - group: Qué significa
