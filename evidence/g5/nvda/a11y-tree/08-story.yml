      - paragraph: La distribución se agrupa por periodos, no por años. Parte de las fechas del Catastro están redondeadas y se concentran en años acabados en 0 o 5 (en Portugalete, 30,9 %). Por eso no leemos picos anuales como momentos de construcción.
