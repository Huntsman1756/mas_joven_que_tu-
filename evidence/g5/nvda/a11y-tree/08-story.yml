    - heading "Para seguir leyendo" [level=2]
    - region "Cinco lugares de Bizkaia":
      - heading "Cinco lugares de Bizkaia" [level=2]
      - paragraph: Cinco conjuntos de edificios donde el mismo dato cuenta historias distintas. Cada capítulo configura el mapa para verlo; tu año y tu lugar se conservan aparte.
      - article:
        - paragraph: Capítulo 1 de 5 · Margen izquierda · seis municipios · 1960–1969
        - heading "Un patrón de los sesenta cruza seis municipios" [level=3]
        - heading "Qué vemos" [level=4]
        - paragraph: Un componente de 21 zonas contiguas cuya década dominante son los años 60 cruza Getxo, Leioa, Portugalete, Santurtzi, Sestao y Trapagaran.
        - heading "El dato" [level=4]
        - paragraph: En este conjunto continuo hay 4.520 edificios actuales con año conocido (cobertura 99,9 %). Entre 1960 y 1969 se terminaron 863 — más que en cualquier otro periodo registrado aquí.
        - heading "Qué sabemos y qué no sabemos" [level=4]
        - paragraph: "Sabemos cuántos edificios actuales constan por periodo. No sabemos por este dato qué produjo el impulso ni qué había antes en cada parcela: el Catastro describe solo los edificios que existen hoy."
